services:
  - type: web
    name: pablo-rojo-setter-ia
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: PORT
        value: 3000
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: DATABASE_URL
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_BEARER_TOKEN
        sync: false
