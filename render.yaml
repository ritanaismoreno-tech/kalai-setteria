# Nota (2026-08-23, rebrand Altiora → Kalai): el servicio real en Render ya
# se renombró a "kalai.setteria" (nombre visible en el panel), pero ya NO
# está gestionado por este Blueprint — se creó a mano vía "New Web Service"
# porque Render bloquea el renombrado de servicios ligados a un Blueprint.
# Este archivo queda solo como referencia de la config (build/start/env vars).
# Ojo: renombrar el servicio en Render NO cambia su URL pública — esa sigue
# siendo altiora-setteria.onrender.com hasta que se recree el servicio con un
# slug nuevo o se le añada un dominio personalizado de kalai.com.
services:
  - type: web
    name: kalai.setteria
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: PORT
        value: 3000
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_BEARER_TOKEN
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
