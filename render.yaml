# Nota (2026-08-23, rebrand Altiora → Kalai): el servicio real en Render
# ("altiora-setteria" todavía, pendiente de renombrar a mano a "kalai-setteria")
# ya NO está gestionado por este Blueprint — se creó a mano vía "New Web Service"
# porque Render bloquea el renombrado de servicios ligados a un Blueprint.
# Este archivo queda solo como referencia de la config (build/start/env vars);
# el nombre de abajo es el destino deseado, no el nombre real actual del servicio.
services:
  - type: web
    name: kalai-setteria
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: PORT
        value: 3000
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_BEARER_TOKEN
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
