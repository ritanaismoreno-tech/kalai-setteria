# Nota (2026-08-23, rebrand Altiora → Kalai): el servicio se recreó desde
# cero en Render como "kalai-setteria" (URL: kalai-setteria.onrender.com),
# ya sin ninguna referencia a Altiora. Sigue sin estar gestionado por este
# Blueprint — se creó a mano vía "New Web Service" porque renombrar un
# servicio existente NO le cambia la URL pública (Render la fija al crear
# el servicio). Este archivo queda solo como referencia de la config
# (build/start/env vars).
services:
  - type: web
    name: kalai-setteria
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: PORT
        value: 3000
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_BEARER_TOKEN
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
